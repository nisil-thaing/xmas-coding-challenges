[serve.static]
plugins = ["bun-plugin-tailwind"]
env = "BUN_PUBLIC_*"
[test]
preload = ["./happydom.ts", "./testing-library.ts"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/happydom.ts",
  "**/testing-library.ts",
  "test/**",
  "tests/**",
  "e2e/**",
  "**/__tests__/**",
  "scripts/**",
  "dist/**",
  "build/**",
  "*.config.*",
]
coverageThreshold = 0.9
